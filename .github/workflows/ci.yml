name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # pnpm 的版本读 package.json 的 packageManager
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Build（dist：静态站 + manifest + service worker）
        run: pnpm build
      - name: Build（dist-single：一个 HTML 文件）
        run: pnpm build:single

  # 冒烟 + 端到端：对着 pnpm build 出来的 dist（pnpm preview）跑三套设置（中文 · 上海 / 英文 · UTC / 手机 375）。
  # 口令放在仓库的 Secrets 里（ARPS_PASS_ADMIN / ARPS_PASS_MEMBER）；没设时要登录示范工会的那几项自动跳过。
  smoke:
    runs-on: ubuntu-latest
    env:
      BUILD_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm build:single
      - name: Smoke
        run: pnpm smoke
        env:
          CI: 1
          ARPS_PASS_ADMIN: ${{ secrets.ARPS_PASS_ADMIN }}
          ARPS_PASS_MEMBER: ${{ secrets.ARPS_PASS_MEMBER }}
      - name: Smoke report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-report
          path: |
            artifacts/smoke/report
            artifacts/smoke/results
          retention-days: 7
